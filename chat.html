<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Mistral AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Inter', system-ui, sans-serif; 
  background: #0c0c0f; 
  color: #ecedf0; 
  height: 100vh; 
  display: flex; 
  flex-direction: column;
}
header {
  padding: 16px 20px;
  border-bottom: 1px solid #26262e;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #16161b;
}
h1 { font-size: 18px; font-weight: 600; }
.badge { background: #ff2d78; color: white; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
.controls { display: flex; gap: 10px; align-items: center; }
select, button {
  background: #1d1d24; color: #ecedf0; border: 1px solid #26262e; border-radius: 6px; padding: 6px 10px; font-size: 13px;
}
button { cursor: pointer; }
button:hover { background: #26262e; }
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.message {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
}
.user { align-self: flex-end; background: #ff2d78; color: white; }
.assistant { align-self: flex-start; background: #1d1d24; border: 1px solid #26262e; }
.system { align-self: center; color: #8b8d98; font-size: 12px; }
#input-area {
  padding: 16px 20px;
  border-top: 1px solid #26262e;
  background: #16161b;
  display: flex;
  gap: 10px;
}
textarea {
  flex: 1;
  background: #1d1d24;
  color: #ecedf0;
  border: 1px solid #26262e;
  border-radius: 8px;
  padding: 12px;
  resize: none;
  font-family: inherit;
  font-size: 14px;
  min-height: 48px;
  max-height: 120px;
}
textarea:focus { outline: none; border-color: #ff2d78; }
#send {
  background: #ff2d78;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 0 20px;
  font-weight: 600;
  cursor: pointer;
}
#send:hover { opacity: 0.9; }
#send:disabled { opacity: 0.5; cursor: not-allowed; }
.loading { opacity: 0.6; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Chat Mistral AI <span class="badge">Conectado</span></h1>
  </div>
  <div class="controls">
    <select id="model">
      <option value="mistral-small-latest">Mistral Small (rápido)</option>
      <option value="mistral-medium-latest">Mistral Medium</option>
      <option value="mistral-large-latest">Mistral Large</option>
      <option value="codestral-latest">Codestral (código)</option>
    </select>
    <button onclick="clearChat()">Limpar</button>
  </div>
</header>

<div id="chat">
  <div class="message system">Chat conectado à sua chave Mistral. Escolha o modelo e comece a conversar.</div>
</div>

<div id="input-area">
  <textarea id="input" placeholder="Digite sua mensagem..." rows="1"></textarea>
  <button id="send" onclick="send()">Enviar</button>
</div>

<script>
const API_KEY = "mstrl_wLUg3lkAuqUYkuKs0WVR5TqNZVVpy3OT_4v4UCM";
const API_URL = "https://api.mistral.ai/v1/chat/completions";

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modelEl = document.getElementById('model');

let history = [];

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function clearChat() {
  history = [];
  chatEl.innerHTML = '<div class="message system">Chat limpo. Comece uma nova conversa.</div>';
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  addMessage('user', text);
  history.push({ role: 'user', content: text });

  const loading = addMessage('assistant', 'Pensando...');
  loading.classList.add('loading');

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${API_KEY}`
      },
      body: JSON.stringify({
        model: modelEl.value,
        messages: history,
        max_tokens: 1024,
        temperature: 0.7
      })
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error(`Erro ${res.status}: ${err}`);
    }

    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || 'Sem resposta';

    loading.textContent = reply;
    loading.classList.remove('loading');
    history.push({ role: 'assistant', content: reply });
  } catch (e) {
    loading.textContent = 'Erro: ' + e.message;
    loading.classList.remove('loading');
    history.pop();
  }

  sendBtn.disabled = false;
  inputEl.focus();
}

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
